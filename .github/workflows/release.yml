name: release

on:
  push:
    branches:
    - '!*'
    tags:
    - v*.*.*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        version: v2.3.2
        args: release --release-notes tools/release/release-note.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/attest@v4.2.2
      with:
        subject-path: 'dist/checksums.txt'
