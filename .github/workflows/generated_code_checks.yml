name: generated-code

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Checkout submodules
      run: git submodule update --init --depth=0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: go generate and diff checks
      # lambda_deprecated_runtime and db_instance_types are excluded because
      # their generators fetch remote data from AWS, making them
      # non-deterministic and dependent on network access.
      run: |
        go generate $(go list ./... | grep -vE 'lambda_deprecated_runtime|db_instance_types|elasticache_node_types')
        git diff --exit-code
