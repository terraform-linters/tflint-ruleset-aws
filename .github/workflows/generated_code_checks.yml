name: generated-code

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Checkout submodules
      run: git submodule update --init --depth=0
    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: go generate and diff checks
      # lambda_deprecated_runtime and db_instance_types are excluded because
      # their generators fetch remote data from AWS, making them
      # non-deterministic and dependent on network access.
      # Running several times catches generators that leak map iteration order.
      run: |
        packages=$(go list ./... | grep -vE 'lambda_deprecated_runtime|db_instance_types|elasticache_node_types')
        for i in 1 2 3 4 5; do
          go generate $packages
          git diff --exit-code
        done
